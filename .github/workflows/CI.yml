name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Cancel intermediate builds: only on the same PR/branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'   # declared minimum
          - '1'      # latest stable 1.x
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          # The ChainRules/Zygote path needs no GPU, so exercise it on every
          # job. CUDA tests stay opt-in (no GPU on hosted runners) and remain
          # skipped unless JULIA_OCTOPUS_TEST_CUDA=1.
          JULIA_OCTOPUS_TEST_CHAINRULES: '1'
      # Defaults to directories: 'src,ext', so the weak extensions are covered
      # too, not just src/.
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          # Requires the CODECOV_TOKEN repository secret. Without it the upload
          # fails and, because fail_ci_if_error is false, does so silently —
          # the badge stays "unknown" while CI still reports green.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
